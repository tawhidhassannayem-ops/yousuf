name: Build Yusuf Electronics APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK and Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_DIR/licenses/google-gdk-license"

          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi
          echo "Using Android SDK at $SDK_DIR"

      - name: Prepare debug keystore and environment config
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK output
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/YusufElectronics-debug.apk
          ls -lh dist/YusufElectronics-debug.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YusufElectronics-APK
          path: dist/YusufElectronics-debug.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/YusufElectronics-debug.apk --clobber
          else
            gh release create "$TAG" dist/YusufElectronics-debug.apk \
              --title "Yusuf Electronics Android APK (Latest)" \
              --notes "Automated APK build from GitHub Actions for Yusuf Electronics." \
              --latest
          fi
          {
            echo "### Yusuf Electronics APK Build Ready"
            echo "- Direct APK download (Releases): look under **Releases -> latest-apk -> YusufElectronics-debug.apk**"
            echo "- Artifact download (Actions): **YusufElectronics-APK**"
          } >> "$GITHUB_STEP_SUMMARY"
